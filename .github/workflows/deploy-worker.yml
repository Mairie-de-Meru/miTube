name: Deploy Worker

# Facultatif : déploie le proxy Cloudflare (worker/) à chaque changement.
# Actif seulement si la variable de dépôt DEPLOY_WORKER vaut "true" et que les secrets
# CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID existent.
on:
  push:
    branches: [main]
    paths: ["worker/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ vars.DEPLOY_WORKER == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes wrangler@4 deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
